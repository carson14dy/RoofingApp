name: Hail history store

# The daily job for the five-year hail and weather history. B1 (D34) rebuilds the trailing store of the NOAA MRMS
# MESH archive (website/hail.py). B2 (D35) joins the reports, official records, radar detections, warnings, zone
# products and station gusts to each tile (website/joins.py). The join also carries the B5 product pulls (D27: the
# older NWS zone editions; D30: the per-tile event files), and it stays fatal by the B2 rule: a failed join or verify
# leaves the last published asset in place. B5 (D38) adds the past weather
# of every location: the climate grid (website/climate.py), the station readings (website/stations.py), the NOHRSC
# snow analysis (website/snowgrid.py) and the river gauges (website/gauges.py). The job publishes the store as a release
# asset named after the branch (main's is hail-store-main.tar.gz), which the Website build reads with --hail-history
# (on main at the owner's decision of 2026-10-21; a branch's build reads its own branch's asset). 12:43 UTC is after
# the 12:00 UTC file is published (about 12:08 UTC). A failed run leaves the last published asset in place: the new
# file goes up under a temporary name and takes the asset's name only once it is complete. A B5 source that fails
# marks its part unavailable in the store (the sheet says so).
# Every B5 step is non-fatal (continue-on-error), has a timeout, and runs on one 40-minute clock (D16, D26).
#
# The address, street and outline steps (B3, D9, D20, D36) run after the joins and the B5 parts, and before the pack.
# The address step reads the MSL Structures and Addresses Framework (website/addresses.py: positions from the shapefile
# geometry, only the DBF fields of its allow-list, never an owner or parcel field) into hail/a/ of the same store. The
# street and outline steps follow it in the same way (website/streets.py, website/buildings.py). No address, street or
# outline step stops the job: a failed build or check leaves the store with that list or block marked unavailable (never
# missing) and the rest of the store as it was.
#
# The B6 parts (DECISIONS D107 to D127: the map's base layers, the landmark points, the five-year pictures and the bubble
# values) are non-fatal, as the B5 parts are, and a part that is not built and checked in a run is marked unavailable (rule 5).
# The store job builds the store fresh each day, so the terrain tiles and the base map vectors are rebuilt here from the caches
# that the monthly job refreshes, with no request (the store job does not carry the last asset's parts forward). The
# landmark and zone-outline caches are read and saved as the B5 downloads are. The daily B6 steps share a 60-minute clock
# (JOB_START + 3600, the daily budget of D105(a)). The bubble values come after the outline steps and their check, and the
# manifest check runs after the last part, before the pack. The monthly job refreshes the terrain descriptions and tiles
# (the tiles of the data month come from the cache, under a 25-minute cap) and the base map vectors (each under a 20-minute
# cap; the base map continues band D under a deadline) and saves their caches under b6-cache/. Its builds start only before
# its clock, 80 minutes after JOB_START (JOB_START + 4800), inside a 110-minute cap. The checks, the marks and the tail (the
# manifest check, the pack and the publish) wait for the monthly end, 105 minutes after JOB_START (JOB_START + 6300): each
# check and mark is capped at the time left to it, and the manifest check, the pack and the publish start only when their
# own cap fits before the monthly end, so the job ends inside the cap. The B5 monthly steps keep their own budgets.
#
# Jobs (D26, D42). The plan job decides whether the monthly job runs: on the first day of the month by schedule, or
# when the monthly input is on. The store job is the daily run: the station list and inventory, the chosen stations'
# files whose Last-Modified changed, the NWPS gauge files that are missing from the cache, the climate prelim days (and
# a new scaled month when NOAA posts one, inside the same update), the cached NOHRSC files (no request), and the product
# pulls. D26 also asks for the NWPS gauge list and each pool detail on every run; the gauges step does not read them
# on a daily run yet (DECISIONS D38, open). The monthly job starts from the release asset the store job published: every
# file of the station candidate union and the regression set, the NWPS and USGS refresh, and the NOHRSC check on NOAA
# (the only NOHRSC request); then it publishes the store again. Every B5 and monthly step is non-fatal, with a timeout;
# the B1 and B2 build steps stay fatal, so a failed build never publishes a partial store (the last release stays).
#
# Once, by hand: the climate backfill (input climate_backfill) reads the 63 scaled months from July 2021 to September
# 2026 and writes the release archive climate-aggregates-RUNID.tar.gz to the hail-climate release. Every later run
# restores the newest archive that unpacks and updates it; with no archive the climate update is skipped, so the
# backfill is never repeated by accident.
#
# First run, by hand: turn on monthly and climate_backfill. It fills the caches (the station candidate union, the
# NOHRSC files, the NWPS and USGS files and the climate aggregates). Without a station list from an earlier release,
# the daily station step reads the candidate union too, so the first daily run is complete as well.

on:
  schedule:
    - cron: "43 12 * * *"
  workflow_dispatch:
    inputs:
      monthly:
        description: "Run the monthly job: the whole station union, the NWPS and USGS refresh, the NOHRSC check"
        type: boolean
        default: false
      climate_backfill:
        description: "Backfill the climate aggregates from the 63 scaled months, once (writes the hail-climate asset)"
        type: boolean
        default: false
  # A branch push that changes the job or the store code runs it once, as the check that the job works on a
  # runner (GitHub dispatches a workflow by hand only once it is on the default branch). The run publishes the
  # same asset the schedule would; a change to the store format must rename the asset so an older build never
  # reads a newer format. Every job publishes under its branch's name (hail-store-<branch>.tar.gz, slashes as
  # dashes; main's is hail-store-main.tar.gz), so a branch job never touches the asset main reads.
  push:
    branches: [main, "claude/**", "codex/**"]
    paths:
      - ".github/workflows/hail-store.yml"
      - "website/hail.py"
      - "website/hail_fixture_data.py"
      - "website/joins.py"
      - "website/addresses.py"
      - "website/streets.py"
      - "website/buildings.py"
      - "website/climate.py"
      - "website/stations.py"
      - "website/snowgrid.py"
      - "website/gauges.py"
      - "website/terrain.py"          # B6 (the terrain tiles, rebuilt from the cache each day)
      - "website/basemap2.py"         # B6 (the base map vectors)
      - "website/landmarks.py"        # B6 (the landmark points)
      - "website/history_layers.py"   # B6 (the five-year pictures, the zone counts and the recent cells)
      - "website/labels.py"           # B6 (the bubble values)

permissions:
  contents: write

concurrency:
  group: hail-store-${{ github.ref }}   # one run per branch at a time; a branch's run never queues behind or cancels main's
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      monthly: ${{ steps.when.outputs.monthly }}
    steps:
      - name: Decide whether the monthly job runs (a scheduled run on the first of the month, or the monthly input)
        id: when
        continue-on-error: true
        timeout-minutes: 2
        env:
          MONTHLY_INPUT: ${{ inputs.monthly }}
          EVENT: ${{ github.event_name }}
        run: |
          due=""
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%d)" = "01" ]; then due=yes; fi
          if [ "$MONTHLY_INPUT" = "true" ]; then due=yes; fi
          echo "monthly=$due" >> "$GITHUB_OUTPUT"
          echo "the monthly job runs this time: ${due:-no}"

  store:
    runs-on: ubuntu-latest
    # 150 minutes until the branch run measures it (D50): the B5 job's 60 and B3's 90. The B5 steps share a 40-minute clock.
    # The six build and verify caps total 45 minutes and the three unavailable caps 15.
    # The uncapped steps (the hail build, the joins with their 35-minute deadline, the pack) are not timed in that
    # measurement, so the total is not yet shown to fit.
    timeout-minutes: 150
    steps:
      - name: Start the job clock (the B5 steps share its 40 minutes; the job cap is 150)
        timeout-minutes: 1
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out the repository
        timeout-minutes: 5
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        timeout-minutes: 5
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the GRIB reader, the HTTP client and the shapefile reader
        timeout-minutes: 5
        run: pip install numpy pygrib requests pyshp

      - name: Name the download cache by month
        timeout-minutes: 1
        id: month
        run: echo "key=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore the downloaded files (optional; a cold cache builds the same store)
        timeout-minutes: 10
        uses: actions/cache@v4
        with:
          path: hail-cache
          key: hail-cache-${{ steps.month.outputs.key }}
          restore-keys: |
            hail-cache-

      - name: Build the store from the NOAA archive
        timeout-minutes: 16
        run: python -m website.hail build --out store --cache hail-cache --procs 4

      - name: Verify the store
        timeout-minutes: 5
        run: python -m website.hail verify store

      - name: Name the asset after the branch (main's is hail-store-main.tar.gz; a branch's job never touches it)
        id: asset
        timeout-minutes: 1
        run: echo "name=hail-store-$(echo "$GITHUB_REF_NAME" | tr '/' '-').tar.gz" >> "$GITHUB_OUTPUT"

      - name: Restore the joins' downloads (optional; a cold cache builds the same joins)
        timeout-minutes: 10
        uses: actions/cache@v4
        with:
          path: joins-cache
          key: joins-cache-${{ steps.month.outputs.key }}
          restore-keys: |
            joins-cache-

      - name: Join reports, records, detections, warnings, zone products and station gusts (with the B5 zone editions and event files)
        timeout-minutes: 53
        # The joins stop new requests at 35 minutes (JOINS_DEADLINE_S, D23); parsing and writing then take about 7 minutes
        # measured live, and requests in flight add up to about 5 minutes, so the step's own stop comes first. Its backstop is
        # 1.5 times that 35-minute deadline, 53 minutes (D75). D42's 1.5 times the measured time is for the steps that have no
        # deadline of their own. A response that trickles past the per-read timeout is cut there, and the job's 150-minute cap
        # is not reached. The join stays fatal (the B2 rule, D35).
        run: python -m website.joins build --store store --cache joins-cache --procs 4

      - name: Verify the joins (the Benchland gate rows are printed)
        timeout-minutes: 1
        run: python -m website.joins verify store

      # ---- B5 (D26, D38). The steps from here to the pack are non-fatal, and they share one clock. The first step
      # writes JOB_START; the B5 window is 2400 seconds (40 minutes) from it. Before each B5 step a clock step writes the
      # seconds left. A B5 step runs only with more than 60 seconds left, and each program it runs is killed at the seconds
      # left (timeout --kill-after=30). A step's deadline is the smaller of its own deadline and the seconds left less 440,
      # because an in-flight request can run about 440 seconds past its deadline. The joins are not on this clock: their
      # limit (JOINS_DEADLINE_S, D23) counts from their own start, so a late join leaves the B5 steps no time, and the
      # 150-minute job cap binds (DECISIONS D38, open item B5-12). The measured times in the part A record
      # (session-archive/b5a-recheck-completion.json, offline, this machine): joins 355 s; climate build 11 s;
      # stations build 32 s; gauges build 2 s; NOHRSC build 1 s. The climate update took 7 to 8 s with no new scaled
      # month, and the whole backfill 222 s for 63 months and 3.72 GB. The download-bound steps (the station refresh, the
      # monthly station read, the backfill) are sized from the measured download rate (median 27.78 MB/s) with room to
      # spare; the first runs on the runner measure them again.

      - name: Seconds left on the B5 clock before the readers
        id: clock_readers
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 2400 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Install the B5 readers (h5py and Pillow; this job only, the site build installs nothing)
        if: ${{ steps.clock_readers.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          LEFT: ${{ steps.clock_readers.outputs.left }}
        run: timeout --kill-after=30 "$LEFT" pip install h5py Pillow

      - name: Seconds left on the B5 clock before the B5 downloads
        id: clock_cache
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 2400 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Restore the B5 downloads (the stations, NWPS, USGS and NOHRSC files; optional, a cold cache builds the same parts)
        if: ${{ steps.clock_cache.outputs.left > 60 }}
        uses: actions/cache@v4
        continue-on-error: true
        timeout-minutes: 10
        with:
          path: b5-cache
          key: b5-cache-${{ github.run_id }}
          restore-keys: |
            b5-cache-

      - name: Seconds left on the B5 clock before the climate restore
        id: clock_climate_restore
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 2400 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Restore the climate aggregates from the hail-climate release (the newest archive that unpacks; none, no climate update)
        id: climate_restore
        if: ${{ steps.clock_climate_restore.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          LEFT: ${{ steps.clock_climate_restore.outputs.left }}
        run: |
          mkdir -p climate-download climate-cache
          # Versioned names (climate-aggregates-RUNID.tar.gz, and the first fixed name): the highest run id is the newest.
          names=$(timeout --kill-after=30 "$LEFT" gh release view hail-climate --json assets --jq '.assets[].name' 2>/dev/null \
            | grep -E '^climate-aggregates(-[0-9]+)?\.tar\.gz$' | sort -t- -k3,3nr || true)
          restored=""
          for name in $names; do
            if timeout --kill-after=30 "$LEFT" gh release download hail-climate --pattern "$name" --dir climate-download --clobber \
                && timeout --kill-after=30 "$LEFT" python -m website.climate unpack --archive "climate-download/$name" --cache climate-cache; then
              restored="$name"
              break
            fi
            echo "the climate archive $name did not unpack; trying an older one"
          done
          if [ -n "$restored" ]; then
            echo "restored=yes" >> "$GITHUB_OUTPUT"
            echo "restored $restored"
          else
            echo "no climate archive to restore; the climate update is skipped"
          fi

      - name: Seconds left on the B5 clock before the climate backfill
        id: clock_backfill
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 2400 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Backfill the climate aggregates (manual and once; reads the 63 scaled months, one file at a time)
        if: ${{ inputs.climate_backfill && steps.clock_backfill.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 30
        env:
          LEFT: ${{ steps.clock_backfill.outputs.left }}
        run: timeout --kill-after=30 "$LEFT" python -m website.climate backfill --cache climate-cache

      - name: Seconds left on the B5 clock before the climate update
        id: clock_climate_update
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 2400 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Update the climate grid (the prelim days, and a new scaled month when NOAA posts one)
        id: climate_update
        if: ${{ steps.clock_climate_update.outputs.left > 60 && (steps.climate_restore.outputs.restored || inputs.climate_backfill) }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          LEFT: ${{ steps.clock_climate_update.outputs.left }}
        run: |
          set -e
          timeout --kill-after=30 "$LEFT" python -m website.climate update --cache climate-cache
          echo "updated=yes" >> "$GITHUB_OUTPUT"

      - name: Seconds left on the B5 clock before the climate build
        id: clock_climate_build
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 2400 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Build the climate files (hail/c/; a cache with no plan raises and writes no block, which the sheet reports)
        if: ${{ steps.clock_climate_build.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          LEFT: ${{ steps.clock_climate_build.outputs.left }}
        run: timeout --kill-after=30 "$LEFT" python -m website.climate build --store store --cache climate-cache

      - name: Seconds left on the B5 clock before the climate verify
        id: clock_climate_verify
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 2400 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Verify the climate files (the cached aggregates; the independent re-read is run by hand)
        if: ${{ steps.clock_climate_verify.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          LEFT: ${{ steps.clock_climate_verify.outputs.left }}
        run: timeout --kill-after=30 "$LEFT" python -m website.climate verify --store store --cache climate-cache

      - name: Seconds left on the B5 clock before the climate publish
        id: clock_climate_publish
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 2400 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Pack and publish the climate aggregates (a new versioned archive; older ones are removed only after the new one unpacks)
        id: climate_publish
        if: ${{ steps.clock_climate_publish.outputs.left > 60 && steps.climate_update.outputs.updated }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          LEFT: ${{ steps.clock_climate_publish.outputs.left }}
        run: |
          set -e
          name="climate-aggregates-${GITHUB_RUN_ID}.tar.gz"
          timeout --kill-after=30 "$LEFT" python -m website.climate pack --cache climate-cache --out "$name"
          if ! timeout --kill-after=30 "$LEFT" gh release view hail-climate > /dev/null 2>&1; then
            timeout --kill-after=30 "$LEFT" gh release create hail-climate --prerelease --title "Climate aggregates" \
              --notes "Monthly aggregates per grid cell of NOAA nClimGrid-Daily (grid estimates) for the hail history. One archive per daily run (climate-aggregates-RUNID.tar.gz; the newest is read). The Website build does not read it."
          fi
          # No --clobber: each run uploads its own name, so an interrupted upload leaves the previous archive in place.
          timeout --kill-after=30 "$LEFT" gh release upload hail-climate "$name"
          # Check the uploaded copy: download it and unpack it into a scratch cache (every member's SHA-256 is checked).
          rm -rf climate-check
          mkdir -p climate-check
          if timeout --kill-after=30 "$LEFT" gh release download hail-climate --pattern "$name" --dir climate-check \
              && timeout --kill-after=30 "$LEFT" python -m website.climate unpack --archive "climate-check/$name" --cache climate-check/cache; then
            # The older archives go only now, after the new one has unpacked.
            old_names=$(timeout --kill-after=30 "$LEFT" gh release view hail-climate --json assets --jq '.assets[].name' 2>/dev/null \
              | grep -E '^climate-aggregates(-[0-9]+)?\.tar\.gz$' | grep -v -x "$name" || true)
            for old in $old_names; do
              timeout --kill-after=30 "$LEFT" gh release delete-asset hail-climate "$old" --yes
            done
          else
            # A copy that does not unpack is removed, so the restore keeps the last good archive.
            timeout --kill-after=30 "$LEFT" gh release delete-asset hail-climate "$name" --yes
            exit 1
          fi

      - name: Seconds left on the B5 clock before the station carry
        id: clock_stations_carry
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 2400 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Carry the last published station list into the new index (the daily scope reads its chosen ids)
        id: stations_carry
        if: ${{ steps.clock_stations_carry.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          ASSET_NAME: ${{ steps.asset.outputs.name }}
          GH_TOKEN: ${{ github.token }}
          LEFT: ${{ steps.clock_stations_carry.outputs.left }}
        run: |
          set -e
          mkdir -p previous-store
          timeout --kill-after=30 "$LEFT" gh release download hail-store --pattern "$ASSET_NAME" --dir previous-store --clobber
          timeout --kill-after=30 "$LEFT" tar xzf "previous-store/$ASSET_NAME" -C previous-store hail/index.json
          count=$(timeout --kill-after=30 "$LEFT" jq -n --slurpfile prev previous-store/hail/index.json '($prev[0].stations.chosen_station_ids // []) | length')
          if [ "$count" -gt 0 ]; then
            timeout --kill-after=30 "$LEFT" jq --slurpfile prev previous-store/hail/index.json '.stations = $prev[0].stations' store/hail/index.json > store/hail/index.carried.json
            mv store/hail/index.carried.json store/hail/index.json
            echo "carried=yes" >> "$GITHUB_OUTPUT"
            echo "carried $count chosen station ids from the last published store"
          fi

      - name: Seconds left on the B5 clock before the station readings
        id: clock_stations
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 2400 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Station readings (the daily scope re-reads changed chosen files; the full union when nothing was carried, as on a first run)
        id: stations
        if: ${{ steps.clock_stations.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 30
        env:
          CARRIED: ${{ steps.stations_carry.outputs.carried }}
          LEFT: ${{ steps.clock_stations.outputs.left }}
        run: |
          if [ "$CARRIED" = "yes" ]; then
            scope=daily
            own=720
          else
            scope=monthly
            own=1620
          fi
          budget=$(( LEFT - 440 ))
          if [ "$budget" -gt "$own" ]; then budget=$own; fi
          timeout --kill-after=30 "$LEFT" python -m website.stations build --store store --cache b5-cache --procs 4 --scope "$scope" \
            --deadline-at "$(( $(date +%s) + budget ))"

      - name: Seconds left on the B5 clock before the drop
        id: clock_drop
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 2400 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Drop a carried station block that this run did not replace (the stations step failed or timed out)
        if: ${{ steps.clock_drop.outputs.left > 60 && steps.stations_carry.outputs.carried && !contains(steps.stations.outcome, 'success') }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          LEFT: ${{ steps.clock_drop.outputs.left }}
        run: |
          timeout --kill-after=30 "$LEFT" jq 'del(.stations)' store/hail/index.json > store/hail/index.reset.json
          mv store/hail/index.reset.json store/hail/index.json

      - name: Seconds left on the B5 clock before the river gauges
        id: clock_gauges
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 2400 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: River gauges (the NWPS and USGS files that are missing from the cache; the monthly job refreshes every one)
        id: gauges
        if: ${{ steps.clock_gauges.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          LEFT: ${{ steps.clock_gauges.outputs.left }}
        run: |
          own=480
          budget=$(( LEFT - 440 ))
          if [ "$budget" -gt "$own" ]; then budget=$own; fi
          timeout --kill-after=30 "$LEFT" python -m website.gauges build --store store --cache b5-cache --procs 3 \
            --deadline-at "$(( $(date +%s) + budget ))"

      - name: Seconds left on the B5 clock before the snow analysis
        id: clock_snow
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 2400 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Snow analysis (the cached NOHRSC files, offline; the monthly job asks NOAA whether the latest file changed)
        id: snow
        if: ${{ steps.clock_snow.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          LEFT: ${{ steps.clock_snow.outputs.left }}
        run: timeout --kill-after=30 "$LEFT" python -m website.snowgrid build --store store --cache b5-cache --offline

      - name: Seconds left on the B5 clock before the station, gauge and snow verify
        id: clock_verify
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 2400 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Verify the station, gauge and snow parts (informational; the index says what did not load)
        if: ${{ steps.clock_verify.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          LEFT: ${{ steps.clock_verify.outputs.left }}
        run: |
          timeout --kill-after=30 "$LEFT" python -m website.stations verify --store store || echo "stations verify did not pass; see the index"
          timeout --kill-after=30 "$LEFT" python -m website.gauges verify --store store --cache b5-cache || echo "gauges verify did not pass; see the index"
          timeout --kill-after=30 "$LEFT" python -m website.snowgrid verify --store store --cache b5-cache || echo "snow verify did not pass; see the index"

      # ---- B6 (D107 to D127): the base map parts, the landmark points, the five-year pictures and the bubble values. Each part
      # is non-fatal and is marked unavailable when it is not built and checked in this run (rule 5). The terrain tiles and the base
      # map vectors come from the caches that the monthly job refreshes (no request); the bubble values wait for the outlines.

      - name: Install Pillow for the terrain tiles, the history pictures and the bubble font (non-fatal; the B6 steps only)
        continue-on-error: true
        timeout-minutes: 5
        run: pip install Pillow || echo "::warning::Pillow did not install; the B6 parts that draw images or fonts are marked unavailable (D20)."

      - name: Seconds left on the B6 clock before the terrain tiles
        id: clock_terrain_daily
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 3600 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Restore the terrain cache (read only; the monthly job saves it after it refreshes the tiles)
        if: ${{ steps.clock_terrain_daily.outputs.left > 60 }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 10
        with:
          path: b6-cache/terrain
          key: b6-cache-terrain-${{ github.run_id }}
          restore-keys: |
            b6-cache-terrain-

      - name: Terrain tiles from the cache (no request; zooms 5 to 10; non-fatal, D20)
        id: terrain_daily
        if: ${{ steps.clock_terrain_daily.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          LEFT: ${{ steps.clock_terrain_daily.outputs.left }}
        run: |
          if timeout --kill-after=30 "$LEFT" python -m website.terrain build --store store --cache b6-cache/terrain --zooms 5-10 --procs 4 --offline; then
            echo "built=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The terrain tiles did not build from the cache; the mark step below says so (D20)."
          fi

      - name: Check the terrain tiles from the cache (no request; non-fatal, D20)
        id: terrain_daily_check
        if: ${{ steps.terrain_daily.outputs.built }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if timeout --kill-after=30 240 python -m website.terrain verify --store store --offline; then
            echo "verified=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The terrain check did not pass; the mark step below says so (D20)."
          fi

      - name: Mark the terrain tiles unavailable when they were not built and checked in this run (non-fatal; D20)
        if: ${{ steps.terrain_daily.outputs.built != 'yes' || steps.terrain_daily_check.outputs.verified != 'yes' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python -m website.terrain unavailable --store store --reason "the terrain tiles were not built and checked from the cache in this update"
          echo "::warning::The terrain tiles are marked unavailable in this store, and the page says so (D20). The rest of the store is kept."

      - name: Seconds left on the B6 clock before the base map vectors
        id: clock_basemap_daily
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 3600 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Restore the base map cache (read only; the monthly job saves it after it continues band D)
        if: ${{ steps.clock_basemap_daily.outputs.left > 60 }}
        uses: actions/cache/restore@v4
        continue-on-error: true
        timeout-minutes: 10
        with:
          path: b6-cache/basemap2
          key: b6-cache-basemap2-${{ github.run_id }}
          restore-keys: |
            b6-cache-basemap2-

      - name: Base map vectors from the cache (no request; non-fatal; the state is read from the index, not the exit code)
        id: basemap_daily
        if: ${{ steps.clock_basemap_daily.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          LEFT: ${{ steps.clock_basemap_daily.outputs.left }}
        run: |
          if timeout --kill-after=30 "$LEFT" python -m website.basemap2 build --store store --cache b6-cache/basemap2 --offline; then
            state=$(python -c "import json; print(json.load(open('store/hail/base/index.json'))['vector']['state'])" || echo "")
            echo "state=$state" >> "$GITHUB_OUTPUT"
            if [ -n "$state" ] && [ "$state" != "unavailable" ]; then echo "built=yes" >> "$GITHUB_OUTPUT"; fi
          else
            echo "::warning::The base map vectors did not build from the cache; the mark step below says so (D20)."
          fi

      - name: Check the base map vectors from the cache (the index, the files and the budgets; non-fatal, D20)
        id: basemap_daily_check
        if: ${{ steps.basemap_daily.outputs.built }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if timeout --kill-after=30 240 python -m website.basemap2 verify --store store --cache b6-cache/basemap2; then
            echo "verified=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The base map check did not pass; the mark step below says so (D20)."
          fi

      - name: Mark the base map vectors unavailable when they were not built and checked in this run (non-fatal; D20)
        if: ${{ steps.basemap_daily.outputs.state != 'unavailable' && (steps.basemap_daily.outputs.built != 'yes' || steps.basemap_daily_check.outputs.verified != 'yes') }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python -m website.basemap2 unavailable --store store --reason "the base map vectors were not built and checked from the cache in this update"
          echo "::warning::The base map vectors are marked unavailable in this store, and the page says so (D20). The rest of the store is kept."

      - name: Seconds left on the B6 clock before the landmark points
        id: clock_landmarks
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 3600 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Restore the landmark cache (the daily job reads and saves it; the monthly job asks every list again)
        if: ${{ steps.clock_landmarks.outputs.left > 60 }}
        uses: actions/cache@v4
        continue-on-error: true
        timeout-minutes: 10
        with:
          path: b6-cache/landmarks
          key: b6-cache-landmarks-${{ github.run_id }}
          restore-keys: |
            b6-cache-landmarks-

      - name: Landmark points (schools, hospitals, airports, fire and EMS stations and parks; the cached lists; non-fatal, D20)
        id: landmarks
        if: ${{ steps.clock_landmarks.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          LEFT: ${{ steps.clock_landmarks.outputs.left }}
        run: |
          if timeout --kill-after=30 "$LEFT" python -m website.landmarks build --store store --cache b6-cache/landmarks; then
            echo "built=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The landmark build did not pass; the mark step below says so (D20)."
          fi

      - name: Landmark check (store files only; non-fatal, D20)
        id: landmarks_check
        if: ${{ steps.landmarks.outputs.built }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if timeout --kill-after=30 180 python -m website.landmarks verify --store store; then
            echo "verified=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The landmark check did not pass; the mark step below says so (D20)."
          fi

      - name: Mark the landmarks unavailable when they were not built and checked in this run (non-fatal; D20)
        if: ${{ steps.landmarks.outputs.built != 'yes' || steps.landmarks_check.outputs.verified != 'yes' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python -m website.landmarks unavailable --store store --reason "the landmark build or its check did not pass in this run"
          echo "::warning::The landmark points are marked unavailable in this store, and the page says so (D20). The rest of the store is kept."

      - name: Seconds left on the B6 clock before the five-year pictures
        id: clock_history
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 3600 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Restore the zone outline file (keyed by its name, so it is fetched once; non-fatal; D20)
        if: ${{ steps.clock_history.outputs.left > 60 }}
        uses: actions/cache@v4
        continue-on-error: true
        timeout-minutes: 10
        with:
          path: b6-cache/zone-outlines
          key: b6-cache-zone-outlines-ugcs-mt-valid-2026-10-25

      - name: Build the five-year pictures, the zone counts, the recent cells and the zone outlines (non-fatal; D20)
        id: hist_build
        if: ${{ steps.clock_history.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          LEFT: ${{ steps.clock_history.outputs.left }}
        run: |
          if timeout --kill-after=30 "$LEFT" python -m website.history_layers build --store store --cache b6-cache/zone-outlines; then
            echo "built=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The history layers did not build; the mark step below says so (D20)."
          fi

      - name: Verify the history layers (the files and their hashes, the PNG sizes and palettes, a sample of zone counts recounted; non-fatal; D20)
        id: hist_verify
        if: ${{ steps.hist_build.outputs.built }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if timeout --kill-after=30 180 python -m website.history_layers verify --store store; then
            echo "verified=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The history check did not pass; the mark step below says so (D20)."
          fi

      - name: Mark the history layers unavailable when they were not built and checked in this run (non-fatal; D20)
        if: ${{ steps.hist_build.outputs.built != 'yes' || steps.hist_verify.outputs.verified != 'yes' }}
        continue-on-error: true
        timeout-minutes: 3
        run: python -m website.history_layers unavailable --store store --reason "the five-year pictures and counts did not pass this update's build or check"

      # ---- End of B5. The B3 steps below (the address, street and outline steps; non-fatal, D36) come next, then the
      # B1 and B2 pack and publish steps (the branch-named asset). Not yet here: the containment step
      # and the fatal store gates before the pack (DECISIONS D38, job-4), which need the stations module's commands.
      - name: Read the framework file's size and date from the MSL server (non-fatal; D20)
        id: src
        run: |
          url="https://ftpgeoinfo.msl.mt.gov/Data/Spatial/MSDI/AddressStructures/StructuresFramework_shp.zip"
          head="$(curl -fsSI --retry 3 "$url" | tr -d '\r' || true)"
          size="$(printf '%s\n' "$head" | awk 'tolower($1) ~ /^content-length:$/ {print $2}' | tail -n 1)"
          modified="$(printf '%s\n' "$head" | sed -n 's/^[Ll]ast-[Mm]odified: //p' | tail -n 1)"
          test -n "$size" && test -n "$modified" || echo "::warning::The framework file's size or date was not read; the address step still runs and marks its part unavailable if the download fails (D20)."
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "modified=$(printf '%s' "$modified" | sha1sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "Framework file: $size bytes, last modified $modified"

      - name: Restore the framework file (keyed by name, size, last-modified and month, so it is re-checked monthly)
        id: structures
        uses: actions/cache@v4
        with:
          path: structures
          key: structures-StructuresFramework_shp.zip-${{ steps.src.outputs.size }}-${{ steps.src.outputs.modified }}-${{ steps.src.outputs.month }}

      - name: Install the projection library (a compatible release; the address step only; non-fatal, D20)
        run: pip install pyproj~=3.8 || echo "::warning::The projection library did not install; the address step marks its part unavailable (D20)."

      - name: Read the roads file's size and date from the MSL server (non-fatal; D20, D25)
        id: roads_src
        run: |
          url="https://ftpgeoinfo.msl.mt.gov/Data/Spatial/MSDI/Transportation/TransportationFramework_shp.zip"
          head="$(curl -fsSI --retry 3 "$url" | tr -d '\r' || true)"
          size="$(printf '%s\n' "$head" | awk 'tolower($1) ~ /^content-length:$/ {print $2}' | tail -n 1)"
          modified="$(printf '%s\n' "$head" | sed -n 's/^[Ll]ast-[Mm]odified: //p' | tail -n 1)"
          test -n "$size" && test -n "$modified" || echo "::warning::The roads file's size or date was not read; the roads step still runs and marks its part unavailable if the download fails (D20)."
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "modified=$(printf '%s' "$modified" | sha1sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "Roads file: $size bytes, last modified $modified"

      - name: Restore the roads file (keyed by name, size, Last-Modified and month, so it is re-checked monthly)
        id: roads
        uses: actions/cache@v4
        with:
          path: roads
          key: roads-TransportationFramework_shp.zip-${{ steps.roads_src.outputs.size }}-${{ steps.roads_src.outputs.modified }}-${{ steps.roads_src.outputs.month }}
          restore-keys: |
            roads-TransportationFramework_shp.zip-

      - name: Build the streets from the Library's Transportation Framework (non-fatal; D20, D25; the layer stays flag-off on main)
        id: roads_build
        # Cap 15 min: a cold-cache run took 386 s with the 118 MB download (timed 2026-10-19, four cores, shared).
        timeout-minutes: 15
        continue-on-error: true
        run: |
          if python -m website.streets build --store store --cache roads --roads-source msl; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The roads build did not pass; the roads step after the check marks the roads unavailable (D20)."
          fi

      - name: Verify the roads (the record count recomputed from the file when it is there; non-fatal; D20)
        id: roads_verify
        # Cap 5 min: 18 s measured on a cold cache (timed 2026-10-19); the floor for a step that reads the zip.
        timeout-minutes: 5
        continue-on-error: true
        run: |
          zip_arg=""
          if [ -f roads/TransportationFramework_shp.zip ]; then zip_arg="--zip roads/TransportationFramework_shp.zip"; fi
          if python -m website.streets verify --store store --roads-source msl $zip_arg; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The roads check did not pass; the roads step after it marks them unavailable (D20)."
          fi

      - name: Mark the roads unavailable when their build or their check did not pass (non-fatal; D20)
        # The store keeps an unavailable roads block, never a missing one: after a crashed build or a failed check the
        # block carries the reason and the r/ shards are removed (website/streets.py, the unavailable command).
        if: steps.roads_build.outputs.built != 'true' || steps.roads_verify.outputs.verified != 'true'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          python -m website.streets unavailable --store store --reason "the roads build or its check did not pass in this run"
          echo "::warning::The roads are marked unavailable in this store, and the sheet says so (D20). The rest of the store is kept."

      - name: Build the address shards and the search index from the framework file (non-fatal; D20, D36)
        id: addr_build
        # Cap 5 min: a cold-cache run took 86 s with the 66 MB download (timed 2026-10-19).
        timeout-minutes: 5
        continue-on-error: true
        run: |
          if python -m website.addresses build --store store --cache structures; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The address build did not pass; the unavailable step after the check marks the list unavailable (D20, D36)."
          fi

      - name: Verify the addresses (counts recomputed from the file when it is there, the no-owner check, the projection pairs, the manifest hashes; non-fatal, D36)
        id: addr_verify
        # Cap 5 min: 40 s measured on a cold cache (timed 2026-10-19).
        timeout-minutes: 5
        continue-on-error: true
        run: |
          zip_arg=""
          if [ -f structures/StructuresFramework_shp.zip ]; then zip_arg="--zip structures/StructuresFramework_shp.zip"; fi
          if python -m website.addresses verify --store store $zip_arg; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The address check did not pass; the unavailable step after it marks the list unavailable (D20, D36)."
          fi

      - name: Mark the address list unavailable when its build or its check did not pass (non-fatal; D20, D36)
        # The store keeps an unavailable block, never a missing one: after a crashed build or a failed check, the block
        # carries the reason and the address files are removed (website/addresses.py, the unavailable command).
        if: steps.addr_build.outputs.built != 'true' || steps.addr_verify.outputs.verified != 'true'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          python -m website.addresses unavailable --store store --reason "the address build or its check did not pass in this run"
          echo "::warning::The address list is marked unavailable in this store, and the sheet says so (D20, D36). The rest of the store is kept."

      - name: Read the outline file's size and date from the USA Structures host (non-fatal; D20, D36)
        id: bld_src
        run: |
          url="https://fema-femadata.s3.us-east-1.amazonaws.com/Partners/ORNL/USA_Structures/Montana/MT_Structures_20260913.zip"
          head="$(curl -fsSI --retry 3 "$url" | tr -d '\r' || true)"
          size="$(printf '%s\n' "$head" | awk 'tolower($1) ~ /^content-length:$/ {print $2}' | tail -n 1)"
          modified="$(printf '%s\n' "$head" | sed -n 's/^[Ll]ast-[Mm]odified: //p' | tail -n 1)"
          test -n "$size" && test -n "$modified" || echo "::warning::The outline file's size or date was not read; the buildings step still runs and marks its part unavailable if the download fails (D20)."
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "modified=$(printf '%s' "$modified" | sha1sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "Outline file: $size bytes, last modified $modified"

      - name: Restore the outline file (keyed by name, size, last-modified and month, so it is re-checked monthly)
        uses: actions/cache@v4
        with:
          path: structures-fema/MT_Structures_20260913.zip*
          key: structures-fema-MT_Structures_20260913.zip-${{ steps.bld_src.outputs.size }}-${{ steps.bld_src.outputs.modified }}-${{ steps.bld_src.outputs.month }}

      - name: Restore the county boundary file (keyed by name and month; non-fatal; D34)
        uses: actions/cache@v4
        with:
          path: counties
          key: counties-cb_2025_us_county_500k-${{ steps.month.outputs.key }}

      - name: Install the geometry reader (pyogrio, a compatible release; the buildings step only; non-fatal, D20)
        run: pip install "pyogrio~=0.13" || echo "::warning::The geometry reader did not install; the buildings step marks its part unavailable (D20)."

      - name: Build the building outlines, their dots and the address join (non-fatal; D20, D26 to D28, D32, D34)
        id: bld_build
        # Cap 10 min: a cold-cache run took 136 s with the 173 MB and 12 MB downloads (timed 2026-10-19). A download
        # that needs its retries (website/buildings.py, three tries) can run past this cap; the step is then non-fatal.
        timeout-minutes: 10
        continue-on-error: true
        run: |
          if python -m website.buildings build --store store --cache structures-fema --counties-cache counties; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The outline build did not pass; the unavailable step after the check marks the outlines unavailable (D20)."
          fi

      - name: Verify the outlines (the bytes and counts recomputed from the file when it is there; non-fatal; D20)
        id: bld_verify
        # Cap 5 min: 119 s measured on a cold cache (timed 2026-10-19).
        timeout-minutes: 5
        continue-on-error: true
        run: |
          zip_arg=""
          county_arg=""
          if [ -f structures-fema/MT_Structures_20260913.zip ]; then zip_arg="--gdb-zip structures-fema/MT_Structures_20260913.zip"; fi
          if [ -f counties/cb_2025_us_county_500k.zip ]; then county_arg="--counties-zip counties/cb_2025_us_county_500k.zip"; fi
          if python -m website.buildings verify --store store $zip_arg $county_arg; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The outline check did not pass; the unavailable step after it marks the outlines unavailable (D20)."
          fi

      - name: Check the address figures after the outline rewrite (the index block equals the files on disk; non-fatal; D49)
        # The outline step moves the matched rows onto the building dots and rewrites the address block's figures
        # (website/buildings.py); this store-only check fails when any figure is stale, so no stale figure is ever cited.
        timeout-minutes: 5
        continue-on-error: true
        run: |
          if ! python -m website.addresses verify --store store; then
            echo "::warning::The address figures do not match the files after the outline rewrite (D49); rebuild the store."
          fi

      - name: Mark the outlines unavailable when their build or their check did not pass (non-fatal; D20)
        # The store keeps an unavailable buildings block, never a missing one: after a crashed build or a failed check the
        # block carries the reason and the b/ and counts files are removed (website/buildings.py, the unavailable command).
        if: steps.bld_build.outputs.built != 'true' || steps.bld_verify.outputs.verified != 'true'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          python -m website.buildings unavailable --store store --reason "the outline build or its check did not pass in this run"
          echo "::warning::The building outlines are marked unavailable in this store, and the sheet says so (D20). The rest of the store is kept."

      - name: Seconds left on the B6 clock before the bubble labels
        id: clock_labels
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 3600 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Label the building outlines with the bubble anchors (non-fatal; D20; after the outlines and their check)
        id: lab_build
        if: ${{ steps.clock_labels.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 12
        env:
          LEFT: ${{ steps.clock_labels.outputs.left }}
        run: |
          if timeout --kill-after=30 "$LEFT" python -m website.labels build --store store; then
            echo "built=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The bubble anchors did not build; the mark step below removes them (D20)."
          fi

      - name: Verify the bubble anchors (a sample of shards recomputed and compared; non-fatal; D20)
        id: lab_verify
        if: ${{ steps.lab_build.outputs.built }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if timeout --kill-after=30 240 python -m website.labels verify --store store --sample 40; then
            echo "verified=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The bubble check did not pass; the mark step below removes the bubble values (D20)."
          fi

      - name: Remove the bubble values when they were not built and checked in this run (non-fatal; D20)
        # The outline step has just rewritten the building shards without their flags, so a labels pass that did not run must
        # say so: the labels block then reads unavailable, never a stale loaded.
        if: ${{ steps.lab_build.outputs.built != 'yes' || steps.lab_verify.outputs.verified != 'yes' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python -m website.labels unavailable --store store --reason "the bubble values did not pass this update's build or check, or did not run"
          echo "::warning::The bubble values are removed from this store, and the page says so (D20). The rest of the store is kept."

      - name: Check the store manifest after the last store part (hail.check_manifest; fatal, so a store that does not check is not published)
        id: manifest
        timeout-minutes: 10
        run: |
          check_store() {
            python - <<'PY'
          import sys
          from website import hail as h
          try:
              h.check_manifest("store")
          except h.HailStoreError as error:
              sys.exit(f"error: {error}")
          print("The store manifest checks out (hail.check_manifest).")
          PY
          }
          if check_store; then
            exit 0
          fi
          # The B6 parts are contained first (D26(b)): each one is removed with its manifest entries and marked unavailable, then
          # the check runs again. A store that still does not check is not published, and the last published asset stays in place.
          echo "::warning::The store manifest did not check. The B6 parts are contained, and the check runs again."
          python -m website.labels unavailable --store store --reason "the store manifest did not check, so the bubble values were removed" || true
          python -m website.history_layers unavailable --store store --reason "the store manifest did not check, so the five-year pictures and counts were removed" || true
          python -m website.landmarks unavailable --store store --reason "the store manifest did not check, so the landmark points were removed" || true
          python -m website.basemap2 unavailable --store store --reason "the store manifest did not check, so the base map vectors were removed" || true
          python -m website.terrain unavailable --store store --reason "the store manifest did not check, so the terrain tiles were removed" || true
          if check_store; then
            echo "::warning::The store manifest checks out once the B6 parts are contained; the store is published without them."
            exit 0
          fi
          echo "::error::The store manifest still does not check after the B6 parts were contained. The store is not published; the last published asset stays in place (D26)."
          exit 1

      - name: Pack the store
        timeout-minutes: 5
        env:
          ASSET: ${{ steps.asset.outputs.name }}
        run: tar czf "$ASSET.new" -C store hail

      - name: Publish the release asset
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.asset.outputs.name }}
        run: |
          notes="Radar estimates (NOAA MRMS MESH) for the five years to the last published day. One asset per branch, named after it (main's is hail-store-main.tar.gz, rebuilt daily); the Website build with --hail-history reads its own branch's asset. Radar estimates, not measurements or inspections."
          if ! gh release view hail-store > /dev/null 2>&1; then
            gh release create hail-store --prerelease --title "Hail history store" --notes "$notes"
          else
            gh release edit hail-store --notes "$notes"
          fi
          # The new file goes up under a temporary name and takes the asset's name only once it is complete, so a
          # failed or interrupted upload leaves the last published asset in place, and a build never finds the name
          # missing for longer than the moment between the two renames below.
          gh release upload hail-store "$ASSET.new" --clobber
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/hail-store" --jq '.assets[] | "\(.id) \(.name)"')
          old_id=""; new_id=""; stale_id=""; shared_id=""
          while read -r id name; do
            case "$name" in
              "$ASSET") old_id=$id;;
              "$ASSET.new") new_id=$id;;
              "$ASSET.old") stale_id=$id;;
              hail-store.tar.gz) shared_id=$id;;
            esac
          done <<< "$assets"
          if [ -z "$new_id" ]; then echo "The uploaded file $ASSET.new is not in the release's asset list; nothing was replaced." >&2; exit 1; fi
          # The old asset steps aside, the new one takes the name, and the old one is removed last. If the new one
          # cannot take the name, the old one gets it back, so the name is never left missing. A .old left by an
          # earlier failed run is removed first.
          if [ -n "$stale_id" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$stale_id"; fi
          if [ -n "$old_id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$old_id" -f name="$ASSET.old" > /dev/null; fi
          if ! gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$new_id" -f name="$ASSET" > /dev/null; then
            if [ -n "$old_id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$old_id" -f name="$ASSET" > /dev/null; fi
            echo "The new file could not take the name $ASSET; the previous asset keeps it." >&2; exit 1
          fi
          if [ -n "$old_id" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old_id"; fi
          echo "Published $ASSET."
          # The earlier branch jobs published under one shared name, hail-store.tar.gz, and the last of them held a
          # later stage's data (the address points) while that stage's gates are open. Any job that finds it removes
          # it; a listing or a removal that fails fails the job.
          if [ -n "$shared_id" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$shared_id"
            echo "Removed the shared-name asset hail-store.tar.gz."
          else
            echo "No shared-name asset to remove."
          fi


  monthly:
    needs: [plan, store]
    if: ${{ always() && needs.plan.outputs.monthly != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Start the job clock (the monthly steps share its 80 minutes; the job cap is 110)
        continue-on-error: true
        timeout-minutes: 1
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out the repository
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the monthly readers (the HTTP client, the shapefile reader, and h5py and Pillow for the NOHRSC check)
        continue-on-error: true
        timeout-minutes: 5
        run: pip install numpy requests pyshp h5py Pillow

      - name: Name the asset after the branch (the daily job's name; the monthly job reads and replaces the same asset)
        continue-on-error: true
        timeout-minutes: 1
        run: echo "ASSET=hail-store-$(echo "$GITHUB_REF_NAME" | tr '/' '-').tar.gz" >> "$GITHUB_ENV"

      - name: Fetch the published store (the daily job's release asset, which the monthly steps change and publish again)
        id: fetch
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf monthly-download store
          mkdir -p monthly-download store
          gh release download hail-store --pattern "$ASSET" --dir monthly-download --clobber
          tar xzf "monthly-download/$ASSET" -C store
          echo "fetched=yes" >> "$GITHUB_OUTPUT"

      - name: Seconds left on the monthly clock before the B5 downloads
        id: clock_cache
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 4800 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Restore the B5 downloads (the station, NWPS, USGS and NOHRSC files of the daily job; optional)
        if: ${{ steps.fetch.outputs.fetched != '' && steps.clock_cache.outputs.left > 60 }}
        uses: actions/cache@v4
        continue-on-error: true
        timeout-minutes: 10
        with:
          path: b5-cache
          key: b5-cache-${{ github.run_id }}
          restore-keys: |
            b5-cache-

      - name: Seconds left on the monthly clock before the station union
        id: clock_stations
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 4800 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Station candidate union and regression set (every file of the monthly scope is read, none skipped)
        id: stations
        if: ${{ steps.fetch.outputs.fetched != '' && steps.clock_stations.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 30
        env:
          LEFT: ${{ steps.clock_stations.outputs.left }}
        run: |
          budget=$(( LEFT - 440 ))
          if [ "$budget" -gt 1620 ]; then budget=1620; fi
          timeout --kill-after=30 "$LEFT" python -m website.stations build --store store --cache b5-cache --procs 4 \
            --scope monthly --deadline-at "$(( $(date +%s) + budget ))"

      - name: Seconds left on the monthly clock before the river gauges
        id: clock_gauges
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 4800 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: River gauges (every NWPS and USGS file refreshed)
        id: gauges
        if: ${{ steps.fetch.outputs.fetched != '' && steps.clock_gauges.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          LEFT: ${{ steps.clock_gauges.outputs.left }}
        run: |
          budget=$(( LEFT - 440 ))
          if [ "$budget" -gt 540 ]; then budget=540; fi
          timeout --kill-after=30 "$LEFT" python -m website.gauges build --store store --cache b5-cache --procs 3 --refresh \
            --deadline-at "$(( $(date +%s) + budget ))"

      - name: Seconds left on the monthly clock before the landmark points
        id: clock_landmarks_monthly
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 4800 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Restore the landmark cache (the daily job saves it; this job asks every list again)
        if: ${{ steps.fetch.outputs.fetched != '' && steps.clock_landmarks_monthly.outputs.left > 60 }}
        uses: actions/cache@v4
        continue-on-error: true
        timeout-minutes: 10
        with:
          path: b6-cache/landmarks
          key: b6-cache-landmarks-${{ github.run_id }}
          restore-keys: |
            b6-cache-landmarks-

      - name: Landmark points, every list asked again (non-fatal; D20)
        id: landmarks_monthly
        if: ${{ steps.fetch.outputs.fetched != '' && steps.clock_landmarks_monthly.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          LEFT: ${{ steps.clock_landmarks_monthly.outputs.left }}
        run: |
          budget=$(( LEFT - 440 ))
          if [ "$budget" -gt 540 ]; then budget=540; fi
          if timeout --kill-after=30 "$LEFT" python -m website.landmarks build --store store --cache b6-cache/landmarks --refresh \
            --deadline-at "$(( $(date +%s) + budget ))"; then
            echo "built=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The monthly landmark build did not pass; the mark step below says so (D20)."
          fi

      - name: Seconds left to the monthly end (105 minutes) before the landmark check
        id: clock_end_landmarks_check
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 6300 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Landmark check after the monthly build (store files only; non-fatal, D20)
        id: landmarks_monthly_check
        if: ${{ steps.landmarks_monthly.outputs.built && steps.clock_end_landmarks_check.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          LEFT: ${{ steps.clock_end_landmarks_check.outputs.left }}
        run: |
          CAP=$(( LEFT < 180 ? LEFT : 180 ))
          if timeout --kill-after=30 "$CAP" python -m website.landmarks verify --store store; then
            echo "verified=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The monthly landmark check did not pass; the mark step below says so (D20)."
          fi

      - name: Seconds left to the monthly end (105 minutes) before the landmark mark
        id: clock_end_landmarks_mark
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 6300 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Mark the landmarks unavailable when the monthly build or its check did not pass (non-fatal; D20)
        if: ${{ steps.landmarks_monthly.outcome != 'skipped' && (steps.landmarks_monthly.outputs.built != 'yes' || steps.landmarks_monthly_check.outputs.verified != 'yes') && steps.clock_end_landmarks_mark.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          LEFT: ${{ steps.clock_end_landmarks_mark.outputs.left }}
        run: |
          CAP=$(( LEFT < 300 ? LEFT : 300 ))
          timeout --kill-after=30 "$CAP" python -m website.landmarks unavailable --store store --reason "the landmark build or its check did not pass in this run"
          echo "::warning::The landmark points are marked unavailable in this store, and the page says so (D20). The rest of the store is kept."

      - name: Seconds left on the monthly clock before the snow analysis
        id: clock_snow
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 4800 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Snow analysis (NOAA's latest NOHRSC file, checked once a month; the only NOHRSC request)
        id: snow
        if: ${{ steps.fetch.outputs.fetched != '' && steps.clock_snow.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          LEFT: ${{ steps.clock_snow.outputs.left }}
        run: |
          budget=$(( LEFT - 440 ))
          if [ "$budget" -gt 240 ]; then budget=240; fi
          timeout --kill-after=30 "$LEFT" python -m website.snowgrid build --store store --cache b5-cache \
            --deadline-at "$(( $(date +%s) + budget ))"

      - name: Seconds left on the monthly clock before the terrain tiles
        id: clock_terrain_monthly
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 4800 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Restore the terrain cache (this job reads the tiles of the data month and saves the cache; the daily job reads it)
        if: ${{ steps.fetch.outputs.fetched != '' && steps.clock_terrain_monthly.outputs.left > 60 }}
        uses: actions/cache@v4
        continue-on-error: true
        timeout-minutes: 10
        with:
          path: b6-cache/terrain
          key: b6-cache-terrain-${{ github.run_id }}
          restore-keys: |
            b6-cache-terrain-

      - name: Terrain tiles, descriptions asked again (zooms 5 to 10; cached tiles; a 25-minute cap; non-fatal, D20)
        id: terrain
        if: ${{ steps.fetch.outputs.fetched != '' && steps.clock_terrain_monthly.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 25
        env:
          LEFT: ${{ steps.clock_terrain_monthly.outputs.left }}
        run: |
          # The build reads both service descriptions again and uses a valid cached tile whatever its age, so a data month
          # that has not changed costs no tile request. The build starts no request in the last 120 seconds before its cap,
          # so the requests in flight (60 seconds each) end inside it.
          CAP=$(( LEFT < 1500 ? LEFT : 1500 ))
          DEADLINE=$(( $(date +%s) + CAP - 120 ))
          if timeout --kill-after=30 "$CAP" python -m website.terrain build --store store --cache b6-cache/terrain --zooms 5-10 --procs 4 --timeout 60 --refresh-descriptions --deadline-at "$DEADLINE"; then
            echo "built=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The terrain build did not pass; the mark step below says so (D20)."
          fi

      - name: Seconds left to the monthly end (105 minutes) before the terrain check
        id: clock_end_terrain_check
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 6300 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Check the terrain tiles after the monthly build (a re-fetch sample of ten tiles at 60 seconds a request, within 900 seconds; non-fatal, D20)
        id: terrain_monthly_check
        if: ${{ steps.terrain.outputs.built && steps.clock_end_terrain_check.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 16
        env:
          LEFT: ${{ steps.clock_end_terrain_check.outputs.left }}
        run: |
          # The check runs for 900 seconds at most, and for less when the monthly end leaves less time.
          CAP=$(( LEFT < 900 ? LEFT : 900 ))
          if timeout --kill-after=30 "$CAP" python -m website.terrain verify --store store --cache b6-cache/terrain --timeout 60; then
            echo "verified=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The terrain check did not pass; the mark step below says so (D20)."
          fi

      - name: Seconds left to the monthly end (105 minutes) before the terrain mark
        id: clock_end_terrain_mark
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 6300 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Mark the terrain tiles unavailable when the monthly build or its check did not pass (non-fatal; D20)
        if: ${{ steps.terrain.outcome != 'skipped' && (steps.terrain.outputs.built != 'yes' || steps.terrain_monthly_check.outputs.verified != 'yes') && steps.clock_end_terrain_mark.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          LEFT: ${{ steps.clock_end_terrain_mark.outputs.left }}
        run: |
          CAP=$(( LEFT < 300 ? LEFT : 300 ))
          timeout --kill-after=30 "$CAP" python -m website.terrain unavailable --store store --reason "the terrain build or its check did not pass in this run"
          echo "::warning::The terrain tiles are marked unavailable in this store, and the page says so (D20). The rest of the store is kept."

      - name: Seconds left on the monthly clock before the base map vectors
        id: clock_basemap_monthly
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 4800 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Restore the base map cache (this job continues band D and saves the cache; the daily job reads it)
        if: ${{ steps.fetch.outputs.fetched != '' && steps.clock_basemap_monthly.outputs.left > 60 }}
        uses: actions/cache@v4
        continue-on-error: true
        timeout-minutes: 10
        with:
          path: b6-cache/basemap2
          key: b6-cache-basemap2-${{ github.run_id }}
          restore-keys: |
            b6-cache-basemap2-

      - name: Base map vectors (bands A to C each month, band D under a deadline; a 20-minute cap; non-fatal, D20)
        id: basemap
        if: ${{ steps.fetch.outputs.fetched != '' && steps.clock_basemap_monthly.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          LEFT: ${{ steps.clock_basemap_monthly.outputs.left }}
        run: |
          # The state is read from the index, because the build exits 0 for an unavailable store (D122(j)).
          CAP=$(( LEFT < 1140 ? LEFT : 1140 ))
          DEADLINE=$(( $(date +%s) + CAP - 120 ))
          if timeout --kill-after=30 "$CAP" python -m website.basemap2 build --store store --cache b6-cache/basemap2 --deadline-at "$DEADLINE"; then
            state=$(python -c "import json; print(json.load(open('store/hail/base/index.json'))['vector']['state'])" || echo "")
            echo "state=$state" >> "$GITHUB_OUTPUT"
            if [ -n "$state" ] && [ "$state" != "unavailable" ]; then echo "built=yes" >> "$GITHUB_OUTPUT"; fi
          else
            echo "::warning::The base map build did not finish; the mark step below says so (D20)."
          fi

      - name: Seconds left to the monthly end (105 minutes) before the base map check
        id: clock_end_basemap_check
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 6300 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Check the base map vectors after the monthly build (the index, the files and the budgets; non-fatal, D20)
        id: basemap_monthly_check
        if: ${{ steps.basemap.outputs.built && steps.clock_end_basemap_check.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 6
        env:
          LEFT: ${{ steps.clock_end_basemap_check.outputs.left }}
        run: |
          CAP=$(( LEFT < 300 ? LEFT : 300 ))
          if timeout --kill-after=30 "$CAP" python -m website.basemap2 verify --store store --cache b6-cache/basemap2; then
            echo "verified=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The base map check did not pass; the mark step below says so (D20)."
          fi

      - name: Seconds left to the monthly end (105 minutes) before the base map mark
        id: clock_end_basemap_mark
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 6300 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Mark the base map vectors unavailable when the monthly build or its check did not pass (non-fatal; D20)
        if: ${{ steps.basemap.outcome != 'skipped' && steps.basemap.outputs.state != 'unavailable' && (steps.basemap.outputs.built != 'yes' || steps.basemap_monthly_check.outputs.verified != 'yes') && steps.clock_end_basemap_mark.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          LEFT: ${{ steps.clock_end_basemap_mark.outputs.left }}
        run: |
          CAP=$(( LEFT < 300 ? LEFT : 300 ))
          timeout --kill-after=30 "$CAP" python -m website.basemap2 unavailable --store store --reason "the base map build or its check did not pass in this run"
          echo "::warning::The base map vectors are marked unavailable in this store, and the page says so (D20). The rest of the store is kept."

      - name: Seconds left on the monthly clock before the monthly verify
        id: clock_verify
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 4800 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Verify the station, gauge and snow parts (informational; the index says what did not load)
        if: ${{ steps.fetch.outputs.fetched != '' && steps.clock_verify.outputs.left > 60 }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          LEFT: ${{ steps.clock_verify.outputs.left }}
        run: |
          timeout --kill-after=30 "$LEFT" python -m website.stations verify --store store || echo "stations verify did not pass; see the index"
          timeout --kill-after=30 "$LEFT" python -m website.gauges verify --store store --cache b5-cache || echo "gauges verify did not pass; see the index"
          timeout --kill-after=30 "$LEFT" python -m website.snowgrid verify --store store --cache b5-cache || echo "snow verify did not pass; see the index"

      - name: Seconds left to the monthly end (105 minutes) before the manifest check
        id: clock_end_manifest
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 6300 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Check the store manifest after the monthly parts (hail.check_manifest; the monthly base map parts are contained when it fails; the publish waits for it)
        id: manifest
        if: ${{ steps.fetch.outputs.fetched != '' && steps.clock_end_manifest.outputs.left > 600 }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          check_store() {
            python - <<'PY'
          import sys
          from website import hail as h
          try:
              h.check_manifest("store")
          except h.HailStoreError as error:
              sys.exit(f"error: {error}")
          print("The store manifest checks out (hail.check_manifest).")
          PY
          }
          if check_store; then
            exit 0
          fi
          echo "::warning::The store manifest did not check. The monthly base map parts are contained, and the check runs again."
          python -m website.landmarks unavailable --store store --reason "the store manifest did not check, so the landmark points were removed" || true
          python -m website.basemap2 unavailable --store store --reason "the store manifest did not check, so the base map vectors were removed" || true
          python -m website.terrain unavailable --store store --reason "the store manifest did not check, so the terrain tiles were removed" || true
          if check_store; then
            echo "::warning::The store manifest checks out once the monthly base map parts are contained; the store is published without them."
            exit 0
          fi
          echo "::error::The store manifest still does not check. The monthly store is not published; the last published asset stays in place (D26)."
          exit 1

      - name: Seconds left to the monthly end (105 minutes) before the pack
        id: clock_end_pack
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 6300 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Pack the store (whatever the monthly steps left in it)
        id: pack
        if: ${{ steps.fetch.outputs.fetched != '' && steps.clock_end_pack.outputs.left > 300 }}
        continue-on-error: true
        timeout-minutes: 5
        run: tar czf "$ASSET.new" -C store hail

      - name: Seconds left to the monthly end (105 minutes) before the publish
        id: clock_end_publish
        continue-on-error: true
        timeout-minutes: 1
        run: echo "left=$(( JOB_START + 6300 - $(date +%s) ))" >> "$GITHUB_OUTPUT"

      - name: Publish the monthly store (the same release asset, replaced only once the pack has been made)
        if: ${{ contains(steps.pack.outcome, 'success') && contains(steps.manifest.outcome, 'success') && steps.clock_end_publish.outputs.left > 600 }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Radar estimates (NOAA MRMS MESH) for the five years to the last published day. One asset per branch, named after it (main's is hail-store-main.tar.gz, rebuilt daily); the Website build with --hail-history reads its own branch's asset. Radar estimates, not measurements or inspections."
          if ! gh release view hail-store > /dev/null 2>&1; then
            gh release create hail-store --prerelease --title "Hail history store" --notes "$notes"
          else
            gh release edit hail-store --notes "$notes"
          fi
          # The new file goes up under a temporary name and takes the asset's name only once it is complete, so a
          # failed or interrupted upload leaves the last published asset in place, and a build never finds the name
          # missing for longer than the moment between the two renames below.
          gh release upload hail-store "$ASSET.new" --clobber
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/hail-store" --jq '.assets[] | "\(.id) \(.name)"')
          old_id=""; new_id=""; stale_id=""; shared_id=""
          while read -r id name; do
            case "$name" in
              "$ASSET") old_id=$id;;
              "$ASSET.new") new_id=$id;;
              "$ASSET.old") stale_id=$id;;
              hail-store.tar.gz) shared_id=$id;;
            esac
          done <<< "$assets"
          if [ -z "$new_id" ]; then echo "The uploaded file $ASSET.new is not in the release's asset list; nothing was replaced." >&2; exit 1; fi
          # The old asset steps aside, the new one takes the name, and the old one is removed last. If the new one
          # cannot take the name, the old one gets it back, so the name is never left missing. A .old left by an
          # earlier failed run is removed first.
          if [ -n "$stale_id" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$stale_id"; fi
          if [ -n "$old_id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$old_id" -f name="$ASSET.old" > /dev/null; fi
          if ! gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$new_id" -f name="$ASSET" > /dev/null; then
            if [ -n "$old_id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$old_id" -f name="$ASSET" > /dev/null; fi
            echo "The new file could not take the name $ASSET; the previous asset keeps it." >&2; exit 1
          fi
          if [ -n "$old_id" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old_id"; fi
          echo "Published $ASSET."
          # The earlier branch jobs published under one shared name, hail-store.tar.gz, and the last of them held a
          # later stage's data (the address points) while that stage's gates are open. Any job that finds it removes
          # it; a listing or a removal that fails fails the job.
          if [ -n "$shared_id" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$shared_id"
            echo "Removed the shared-name asset hail-store.tar.gz."
          else
            echo "No shared-name asset to remove."
          fi
