name: Tests

# Runs the offline unit tests on every push to main, on every pull request and by hand.
# A red X here means the test suite failed: fix it before merging.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests
