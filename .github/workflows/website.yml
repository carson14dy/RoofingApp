name: Website

# Builds the Montana Hail Watch website from live NWS, SPC and NOAA data.
#
# main + GitHub Pages turned on: rebuilds every 10 minutes and publishes the site.
#   Turn Pages on once: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Branch pushes (claude/**, codex/**): a live preview check. The build fails if any source
#   failed or was stale (--require-live), and the built site is kept as a downloadable artifact.
#
# GitHub pauses scheduled workflows after 60 days without repository activity; re-enable it in
# the Actions tab if the site stops updating. Every page says how old it is.

on:
  # Off the top of the hour: a measured experiment adopted 2026-10-18 (docs/DECISIONS.md, D33).
  # From 2026-10-16 19:42 to 2026-10-17 08:57 UTC (about 13 hours) the */10 schedule on main started
  # 4 times, with gaps of 151.5, 141.6 and 264.5 minutes. GitHub's docs say scheduled runs can be
  # delayed at high load, "High load times include the start of every hour", and queued jobs may be
  # dropped. To judge the change, count the scheduled runs in the 24 hours after this merges (144 is
  # every 10 minutes) and compare the count with those 4 runs.
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main, "claude/**", "codex/**"]
    paths:
      - "website/**"
      - "tests/test_site.py"
      - "tests/test_gridded.py"
      - "tests/test_basemap.py"
      - "tests/test_storm.py"
      - "tests/test_satellite.py"
      - "tests/test_hail.py"
      - "tests/test_joins.py"
      - "tests/test_addresses.py"
      - "tests/test_streets.py"
      - "tests/test_buildings.py"
      - "tests/test_website_workflow.py"
      - "tests/test_swath.py"
      - "tools/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Plan (publish only from main with Pages on)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_url=""
          publish=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if candidate=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url) &&
               [[ "$candidate" =~ ^https://[[:alnum:]][[:alnum:].-]*(/[^[:space:]]*)?$ ]]; then
              pages_url="$candidate"
              publish=true
            else
              echo '::warning::Pages lookup failed or returned no valid HTTPS URL. Check Settings > Pages > Build and deployment > Source: GitHub Actions. No deployment will be attempted.'
            fi
          fi
          # A schedule tick with nothing to publish has nothing to do.
          if [ "$publish" = false ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then run=false; else run=true; fi
          {
            echo "publish=$publish"
            echo "run=$run"
            echo "pages_url=$pages_url"
          } >> "$GITHUB_OUTPUT"
          echo "publish=$publish run=$run pages_url=${pages_url:-none}"

      - uses: actions/checkout@v4
        if: steps.plan.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.plan.outputs.run == 'true'
        # pyarrow is for the hail compare tests only (tests/test_hail.py); the site build never imports it.
        # pyproj and pyogrio read the B3 address, street and outline files in the offline tests (D2, D19): compatible
        # releases, never pinned.
        run: python -m pip install requests jinja2 pillow numpy pygrib h5py pyarrow "pyproj~=3.8" "pyogrio~=0.13"

      - name: Website tests (offline)
        if: steps.plan.outputs.run == 'true'
        run: python -m unittest tests.test_site tests.test_gridded tests.test_basemap tests.test_storm tests.test_satellite tests.test_hail tests.test_joins tests.test_addresses tests.test_streets tests.test_buildings tests.test_swath tests.test_climate tests.test_stations tests.test_snowgrid tests.test_gauges tests.test_summary tests.test_hail_workflow tests.test_website_workflow

      - name: Build from live data
        if: steps.plan.outputs.run == 'true'
        env:
          PAGES_URL: ${{ steps.plan.outputs.pages_url }}
        run: |
          set -o pipefail   # the build's exit code must reach the step: without this, tee's 0 hid a --require-live failure
          args=(--out _site)
          if [ -n "$PAGES_URL" ]; then args+=(--previous "$PAGES_URL"); fi
          # Branch pushes also read NOAA radar echo tops (text only), the GOES satellite picture, the five-year
          # hail history (its store is downloaded) and the address, street and outline layers (B3, --hail-addresses);
          # off on main until reviewed.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then args+=(--require-live --storm-layers --hail-history --hail-addresses); fi
          python -m website.build "${args[@]}" | tee build-result.json

      - name: Map smoke test in a real browser (branch pushes)
        if: steps.plan.outputs.run == 'true' && github.ref != 'refs/heads/main'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tools/smoke_map.py _site --addresses

      - name: Page width check in a real browser (branch pushes)
        if: steps.plan.outputs.run == 'true' && github.ref != 'refs/heads/main'
        run: python tools/smoke_pages.py _site

      - name: Summary of what each source returned
        if: always() && steps.plan.outputs.run == 'true'
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("build-result.json")
          if not p.exists() or not p.read_text().strip():
              print("The build did not finish; see the log."); raise SystemExit
          r = json.loads(p.read_text())
          print("| Source | Loaded | Detail |\n|---|---|---|")
          for s in r["status"].values():
              print(f"| {s['label']} | {'yes' if s['ok'] else '**no**'} | {s['detail']} |")
          print(f"\nAlerts: {r['alerts']} ({r['alerts_null_geometry']} without an outline). "
                f"Towns with a forecast: {r['towns_with_forecast']}, with gusts: {r['towns_with_gusts']}. "
                f"Storm reports: {r['reports']}.")
          print("\n| Map layer | Frames | Radar | Forecast | First | Last | HRRR run |\n|---|---|---|---|---|---|---|")
          for key, m in (r.get("map") or {}).items():
              print(f"| {key} | {m['frames']} | {m['radar']} | {m['forecast']} | {m['first'] or '—'} | "
                    f"{m['last'] or '—'} | {m['run'] or '—'} |")
          c = r.get("content") or {}
          storm = [(n, t["storm"]) for n, t in (c.get("towns") or {}).items() if t.get("storm")]
          if storm:
              print("\nRadar echo tops (branch preview, --storm-layers):")
              for name, text in storm:
                  print(f"- {name}: {text}")
          if c.get("satellite"):
              print("\nSatellite picture (branch preview, --storm-layers): " + c["satellite"])
          if c.get("hail"):
              print("\nHail history (branch preview, --hail-history):")
              for name, text in c["hail"].items():
                  print(f"- {name}: {text}")
          if c.get("alert_events"):
              print("\nAlerts: " + "; ".join(c["alert_events"]))
          print("\nReports per SPC day: " + ", ".join(f"{d}: {n}" for d, n in (c.get("reports_by_day") or {}).items()))
          print("\n| Town | Low–high °F | Gust mph | Wind mph | Rain/snow % | Flagged of 12 h | Forecast issued | Office | Alerts | Observed now |")
          print("|---|---|---|---|---|---|---|---|---|---|")
          dash = lambda v: "—" if v is None else round(v) if isinstance(v, float) else v
          def now(n):
              if not n:
                  return "no reading"
              gust = "no gust reported" if n["no_gust"] else f"gusts {dash(n['gust_mph'])}"
              return (f"{dash(n['temp_f'])} °F, {dash(n['wind_mph'])} mph {n['dir']}, {gust} "
                      f"({n['station']}, {n['miles']} mi, {n['age_min']} min{'' if n['current'] else ', stale'})")
          for name, t in (c.get("towns") or {}).items():
              print(f"| {name} | {dash(t['lo'])}–{dash(t['hi'])} | {dash(t['gust'])} | {dash(t['wind'])} | "
                    f"{dash(t['precip'])} | {t['flagged']} | {t['issued']} | {t['office'] or '—'} | "
                    f"{'not checked' if t['alerts'] is None else t['alerts']} | {now(t.get('now'))} |")
          EOF

      - name: Keep the built site (preview)
        if: always() && steps.plan.outputs.run == 'true' && steps.plan.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: _site
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Package for GitHub Pages
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
