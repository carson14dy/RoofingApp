name: Website

# Builds the Montana Hail Watch website from live NWS, SPC and NOAA data.
#
# main + GitHub Pages turned on: asks for a rebuild every 10 minutes (GitHub keeps the schedule loosely; D33) and publishes the site.
#   Turn Pages on once: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Branch pushes (claude/**, codex/**): a live preview check. The build fails if any source
#   failed or was stale (--require-live), and the built site is kept as a downloadable artifact.
#
# GitHub pauses scheduled workflows after 60 days without repository activity; re-enable it in
# the Actions tab if the site stops updating. Every page says how old it is.

on:
  # Off the top of the hour: a measured experiment adopted 2026-10-18 (docs/DECISIONS.md, D33).
  # From 2026-10-16 19:42 to 2026-10-17 08:57 UTC (about 13 hours) the */10 schedule on main started
  # 4 times, with gaps of 151.5, 141.6 and 264.5 minutes. GitHub's docs say scheduled runs can be
  # delayed at high load, "High load times include the start of every hour", and queued jobs may be
  # dropped. To judge the change, count the scheduled runs in the 24 hours after this merges (144 is
  # every 10 minutes) and compare the count with those 4 runs.
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main, "claude/**", "codex/**"]
    paths:
      - "website/**"
      - "tests/test_site.py"
      - "tests/test_gridded.py"
      - "tests/test_basemap.py"
      - "tests/test_storm.py"
      - "tests/test_satellite.py"
      - "tests/test_hail.py"
      - "tests/test_joins.py"
      - "tests/test_addresses.py"
      - "tests/test_streets.py"
      - "tests/test_buildings.py"
      - "tests/test_website_workflow.py"
      - "tests/test_hail_workflow.py"
      - "tests/test_swath.py"
      # Every website test module and the words-rules helper; PushPathsCoverTheTests in tests/test_website_workflow.py checks this list.
      - "tests/test_climate.py"
      - "tests/test_stations.py"
      - "tests/test_snowgrid.py"
      - "tests/test_gauges.py"
      - "tests/test_summary.py"
      - "tests/test_terrain.py"        # B6 (P1: the terrain tiles)
      - "tests/test_basemap2.py"       # B6 (P2: the base map vectors)
      - "tests/test_landmarks.py"      # B6 (P3: the landmark points)
      - "tests/test_history_layers.py" # B6 (P4: the pictures, zone counts and recent cells)
      - "tests/test_labels.py"         # B6 (P4: the bubble values)
      - "tests/test_words_rules.py"
      - "tests/words_rules.py"
      - "tests/fixtures/**"            # the default-build manifest and other test fixtures (D102(b))
      - "tools/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # D92(b)'s 25 minutes cannot hold the wait: it runs in this job, up to 60 minutes (D59). So a branch has 75 for the wait,
    # the build, the real-store parity step (D88(a)) and the browser smoke after it. Main keeps 15: it never waits.
    timeout-minutes: ${{ github.ref == 'refs/heads/main' && 15 || 75 }}   # a branch preview may wait up to 60 minutes for its store job
    permissions:
      contents: read
      pages: read
      actions: read   # the wait step lists the branch's latest store job
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Plan (publish only from main with Pages on)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_url=""
          publish=false
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if candidate=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url) &&
               [[ "$candidate" =~ ^https://[[:alnum:]][[:alnum:].-]*(/[^[:space:]]*)?$ ]]; then
              pages_url="$candidate"
              publish=true
            else
              echo '::warning::Pages lookup failed or returned no valid HTTPS URL. Check Settings > Pages > Build and deployment > Source: GitHub Actions. No deployment will be attempted.'
            fi
          fi
          # A schedule tick with nothing to publish has nothing to do.
          if [ "$publish" = false ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then run=false; else run=true; fi
          {
            echo "publish=$publish"
            echo "run=$run"
            echo "pages_url=$pages_url"
          } >> "$GITHUB_OUTPUT"
          echo "publish=$publish run=$run pages_url=${pages_url:-none}"

      - uses: actions/checkout@v4
        if: steps.plan.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: steps.plan.outputs.run == 'true'
        # pyarrow is for the hail compare tests only (tests/test_hail.py); the site build never imports it.
        # pyproj and pyogrio read the B3 address, street and outline files in the offline tests (D2, D19): compatible
        # releases, never pinned. pyyaml is for the workflow file tests (tests/test_website_workflow.py and
        # tests/test_hail_workflow.py read the YAML of both workflows).
        run: python -m pip install requests jinja2 pillow numpy pygrib h5py pyarrow pyyaml "pyproj~=3.8" "pyogrio~=0.13" pyshp

      - name: Website tests (offline)
        if: steps.plan.outputs.run == 'true'
        run: python -m unittest tests.test_site tests.test_gridded tests.test_basemap tests.test_storm tests.test_satellite tests.test_hail tests.test_joins tests.test_addresses tests.test_streets tests.test_buildings tests.test_swath tests.test_climate tests.test_stations tests.test_snowgrid tests.test_gauges tests.test_summary tests.test_words_rules tests.test_hail_workflow tests.test_website_workflow tests.test_terrain tests.test_basemap2 tests.test_landmarks tests.test_history_layers tests.test_labels

      - name: Wait for this branch's hail history store job (branch previews read the asset it publishes)
        if: steps.plan.outputs.run == 'true' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push that changes the store code starts the store job and this preview at the same moment, and the
          # preview reads whatever asset is published when its build starts. So wait for the branch's latest store
          # run (this commit's, or an earlier commit's still going), for up to 60 minutes, the store job's own cap
          # (the B1 job ran 10.7 minutes on 2026-10-18; the B3-stage job 35.6 minutes on 2026-10-20; a later stage
          # raises this bound, the job cap and the timeout above together). When that latest run is this commit's
          # and did not succeed, or the listing fails, or the run is still going at the end, this step fails; when
          # the latest run is an earlier commit's and did not succeed, the asset stays as it was and the build's own
          # rules (the fallback to main's asset, the stale rule) decide. main never waits: its store job replaces
          # the asset in one step.
          i=0
          while :; do
            i=$((i + 1))
            if ! state=$(timeout 60 gh run list --workflow hail-store.yml --branch "$GITHUB_REF_NAME" --limit 1 --json status,conclusion,headSha --jq '.[0] | "\(.status) \(.conclusion) \(.headSha)"'); then
              echo "The store job's state could not be read. Check the gh output above and the build job's actions: read scope."; exit 1
            fi
            set -- $state
            case "$1" in
              ""|null) echo "No store job on this branch; the build reads the asset already published."; exit 0;;
              completed)
                if [ "$2" = success ]; then echo "The store job succeeded, after $i checks."; exit 0; fi
                if [ "$3" = "$GITHUB_SHA" ]; then echo "The store job for this commit ended as $2. Read its log in the Actions tab."; exit 1; fi
                echo "The branch's last store job ended as $2 (an earlier commit); the build reads the asset already published."; exit 0;;
              *)
                if [ "$i" -ge 60 ]; then echo "The store job is still running after 60 minutes. Read its log in the Actions tab, then re-run this build."; exit 1; fi
                case "$1" in in_progress) word=running;; *) word=queued;; esac
                echo "The store job is $word; waiting a minute."; sleep 60;;
            esac
          done

      - name: Build from live data
        if: steps.plan.outputs.run == 'true'
        env:
          PAGES_URL: ${{ steps.plan.outputs.pages_url }}
        run: |
          set -o pipefail   # the build's exit code must reach the step: without this, tee's 0 hid a --require-live failure
          args=(--out _site)
          if [ -n "$PAGES_URL" ]; then args+=(--previous "$PAGES_URL"); fi
          # Branch pushes read NOAA radar echo tops (text only), the GOES satellite picture, the five-year hail
          # history (its store is downloaded) and the address, street and outline layers (B3, --hail-addresses), and
          # fail on any failed source (--require-live).
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then args+=(--require-live --storm-layers --hail-history --hail-addresses); fi
          # On main at the owner's decisions of 2026-10-21 (the hail history, D34) and 2026-10-28 (the address, street and
          # outline layers and the storm layers, D146): every layer is public. The store download is a source like any
          # other, so a failed download leaves the pages saying the history is unavailable (never an all-clear) and the
          # rest of the site still publishes; a storm source that fails shows its own problem line. main never passes
          # --require-live: a failed source is said on the page, not a failed publish.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then args+=(--hail-history --hail-addresses --storm-layers); fi
          # Each build reads its own branch's store asset, named as the store job names it (main's is
          # hail-store-main.tar.gz), and a branch with no asset of its own reads main's; a branch job never writes
          # what main reads.
          export HAIL_STORE_ASSET="hail-store-$(echo "$GITHUB_REF_NAME" | tr '/' '-').tar.gz"
          python -m website.build "${args[@]}" | tee build-result.json

      - name: Real-store parity tests (branch pushes)
        if: steps.plan.outputs.run == 'true' && github.ref != 'refs/heads/main'
        # The seven tests that read HAIL_PARITY_STORE (tests/test_site.py and tests/test_summary.py) check the sheet and the
        # town pages against the store, so they run after the build, against the site's own copy of the store (D75(a),
        # _site/hail). The step fails when that copy has no tile lists (hail/tl): a missing store is a failure, never a skip.
        # A test that skips anyway fails the step too. They are named one by one; tests/test_website_workflow.py (ParityStep)
        # checks the names against the test modules, so a renamed or new gated test cannot drop out silently (D88(a)).
        env:
          HAIL_PARITY_STORE: _site
        run: |
          set -o pipefail
          if [ ! -d _site/hail/tl ]; then
            echo '::error::_site/hail/tl is missing, so the real-store parity tests have no store to read. The build must pass --hail-history.'
            exit 1
          fi
          python -m unittest \
            tests.test_site.MapBlocksForTheBrowser.test_with_the_real_store_every_town_page_leads_with_station_reading_and_map_json_is_under_160_kb \
            tests.test_site.SheetFiveSeasonsInTheBrowser.test_with_the_real_store_every_row_note_reaches_the_sheet_at_four_cells \
            tests.test_site.SheetAgreesWithTheModule.test_the_five_cells_agree_on_the_adopted_store \
            tests.test_site.SummaryContract.test_the_real_store_names_are_the_display_names_the_store_gives \
            tests.test_summary.StationPicksAndNames.test_the_real_store_picks_are_the_rule_at_the_17_towns_and_the_named_cells \
            tests.test_summary.StationPicksAndNames.test_the_real_store_names_are_the_display_names_the_store_gives_and_its_radar_is_partial \
            tests.test_summary.TownPartialSeasonTests.test_the_candidate_store_gives_the_billings_partial_counts_it_holds 2>&1 | tee parity.log
          if grep -q '(skipped=' parity.log; then
            echo '::error::A real-store parity test was skipped, so the store was not checked.'
            exit 1
          fi

      - name: Map smoke test in a real browser (branch pushes)
        if: steps.plan.outputs.run == 'true' && github.ref != 'refs/heads/main'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          # --addresses: the preview's B3 flag; --history: the preview's --hail-history flag, so a missing five-season summary
          # fails here instead of passing with a note (tools/smoke_map.py, check_summary). No --store: the smoke reads the
          # site's own hail/ folder, which holds B4's live files under hail/live/ that the store reader skips (D75).
          python tools/smoke_map.py _site --addresses --history

      - name: Page width check in a real browser (branch pushes)
        if: steps.plan.outputs.run == 'true' && github.ref != 'refs/heads/main'
        run: python tools/smoke_pages.py _site --history

      - name: Summary of what each source returned
        if: always() && steps.plan.outputs.run == 'true'
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("build-result.json")
          if not p.exists() or not p.read_text().strip():
              print("The build did not finish; see the log."); raise SystemExit
          r = json.loads(p.read_text())
          print("| Source | Loaded | Detail |\n|---|---|---|")
          for s in r["status"].values():
              print(f"| {s['label']} | {'yes' if s['ok'] else '**no**'} | {s['detail']} |")
          print(f"\nAlerts: {r['alerts']} ({r['alerts_null_geometry']} without an outline). "
                f"Towns with a forecast: {r['towns_with_forecast']}, with gusts: {r['towns_with_gusts']}. "
                f"Storm reports: {r['reports']}.")
          print("\n| Map layer | Frames | Radar | Forecast | First | Last | HRRR run |\n|---|---|---|---|---|---|---|")
          for key, m in (r.get("map") or {}).items():
              print(f"| {key} | {m['frames']} | {m['radar']} | {m['forecast']} | {m['first'] or '—'} | "
                    f"{m['last'] or '—'} | {m['run'] or '—'} |")
          c = r.get("content") or {}
          storm = [(n, t["storm"]) for n, t in (c.get("towns") or {}).items() if t.get("storm")]
          if storm:
              print("\nRadar echo tops (branch preview, --storm-layers):")
              for name, text in storm:
                  print(f"- {name}: {text}")
          if c.get("satellite"):
              print("\nSatellite picture (branch preview, --storm-layers): " + c["satellite"])
          if c.get("hail"):
              print("\nHail history (--hail-history):")
              for name, text in c["hail"].items():
                  print(f"- {name}: {text}")
          if c.get("alert_events"):
              print("\nAlerts: " + "; ".join(c["alert_events"]))
          print("\nReports per SPC day: " + ", ".join(f"{d}: {n}" for d, n in (c.get("reports_by_day") or {}).items()))
          print("\n| Town | Low–high °F | Gust mph | Wind mph | Rain/snow % | Flagged of 12 h | Forecast issued | Office | Alerts | Observed now |")
          print("|---|---|---|---|---|---|---|---|---|---|")
          dash = lambda v: "—" if v is None else round(v) if isinstance(v, float) else v
          def now(n):
              if not n:
                  return "no reading"
              gust = "no gust reported" if n["no_gust"] else f"gusts {dash(n['gust_mph'])}"
              return (f"{dash(n['temp_f'])} °F, {dash(n['wind_mph'])} mph {n['dir']}, {gust} "
                      f"({n['station']}, {n['miles']} mi, {n['age_min']} min{'' if n['current'] else ', stale'})")
          for name, t in (c.get("towns") or {}).items():
              print(f"| {name} | {dash(t['lo'])}–{dash(t['hi'])} | {dash(t['gust'])} | {dash(t['wind'])} | "
                    f"{dash(t['precip'])} | {t['flagged']} | {t['issued']} | {t['office'] or '—'} | "
                    f"{'not checked' if t['alerts'] is None else t['alerts']} | {now(t.get('now'))} |")
          EOF

      - name: Keep the built site (preview)
        if: always() && steps.plan.outputs.run == 'true' && steps.plan.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: _site
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Package for GitHub Pages
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
