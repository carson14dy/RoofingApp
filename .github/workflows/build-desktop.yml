name: Build desktop installers

# Builds the Windows and macOS apps. Run it from the Actions tab
# ("Run workflow"), or push a tag like desktop-v1.0.0 to also publish a
# GitHub Release with both downloads attached.
#
# Only needed for a first install or when the desktop shell changes.
# Everyday app updates ship by bumping payload/manifest.json — no installer.
#
# Private repo? Add a read-only fine-grained token (Contents: read) as the
# repository secret UPDATE_TOKEN so installed apps can read updates.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: BigSkyHailWatch-Windows.zip
          - os: macos-latest
            asset: BigSkyHailWatch-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Self-test the app payload
        run: python desktop/launcher.py --selftest payload
      - name: Build
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: python build.py --repo "${{ github.repository }}" --branch "${{ github.event.repository.default_branch }}" --token-env UPDATE_TOKEN

      - name: Self-test inside the built app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/BigSkyHailWatch/BigSkyHailWatch.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The built app failed its self-test" }
      - name: Self-test inside the built app (macOS)
        if: runner.os == 'macOS'
        run: dist/BigSkyHailWatch.app/Contents/MacOS/BigSkyHailWatch --selftest

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/BigSkyHailWatch -DestinationPath ${{ matrix.asset }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/BigSkyHailWatch.app ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
